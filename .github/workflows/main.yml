name: CI
on:
  push:
    branches:
      - master
      - 'release/*'
  pull_request:
    branches:
      - master
      - 'release/*'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    # Official Playwright image: browsers + system deps preinstalled, so no
    # apt-based install step (slow apt mirrors were timing out WebKit deps in
    # formkit/drag-and-drop#219). Keep the tag in sync with @playwright/test;
    # the "Check Playwright image version" step enforces it.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is read from package.json#packageManager
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      
      - name: Check Playwright image version
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "1.57.0" ]; then
            echo "::error::@playwright/test is $installed but the CI container is v1.57.0-noble. Update the image tag in main.yml."
            exit 1
          fi

      - name: Build project
        run: NO_NUXT=1 pnpm build
      
      - name: Run Playwright tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
      - name: Upload Playwright videos (visual)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/**/video.webm
